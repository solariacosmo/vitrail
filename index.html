<style>
/* Layout: one full-bleed WebGL nave lit only by its windows; a single quiet control strip floats at the bottom edge and hides on tap. */
:root{
  --night:#07060a;
  --ink:#efe6d8;
  --ink-dim:rgba(239,230,216,.6);
  --veil:rgba(14,11,18,.55);
  --edge:rgba(239,230,216,.16);
  --lit:#f2b04a;
  --serif:"Cormorant Garamond","Iowan Old Style","Songti SC","STSong",Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#nave{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .45s ease}
#nave.dragging{cursor:grabbing}
#nave.fading{opacity:.15}
.hud{
  position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;transition:opacity .5s ease,transform .5s ease;
}
.hud.off{opacity:0;transform:translateY(8px)}
.hud.off *{pointer-events:none!important}
.hint{
  margin:0;font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:.04em;color:var(--ink-dim);
  text-shadow:0 1px 8px rgba(0,0,0,.8);transition:opacity 1.2s ease;text-align:center;
}
.hint.gone{opacity:0}
.bar{
  pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;
  max-width:100%;padding:6px;border-radius:22px;background:var(--veil);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
}
.hours{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
button{
  font:inherit;color:var(--ink);background:transparent;border:0;border-radius:999px;cursor:pointer;
  min-height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.02em;
}
button:focus-visible{outline:1.5px solid var(--lit);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.hour .sw{width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.hour .lat{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1}
.hour .zh{color:var(--ink-dim);font-size:12px}
.hour[aria-checked="true"]{background:rgba(239,230,216,.12)}
.hour[aria-checked="true"] .zh{color:var(--ink)}
.sep{width:1px;height:20px;background:var(--edge);margin:0 2px}
.tool[aria-pressed="true"]{color:var(--lit)}
.glassbtn .sw{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#FAF9F5 0 30%,#D97757 30% 70%,#6A9BCC 70%);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;opacity:.55}
.glassbtn[aria-pressed="true"] .sw{opacity:1}
.tool .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.note{
  position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  max-width:min(420px,calc(100% - 32px));margin:0;padding:10px 16px;border-radius:14px;background:var(--veil);
  border:1px solid var(--edge);font-size:13px;line-height:1.5;color:var(--ink);text-align:center;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .6s ease;
}
@media (max-width:520px){
  .hour .zh{display:none}
  .sep{display:none}
  button{padding:0 11px}
}
@media (prefers-reduced-motion:reduce){
  #nave,.hud,.hint{transition:none}
}

<canvas id="nave" aria-label="A Gothic nave lit only by its stained-glass windows, with shafts of light that drift slowly"></canvas>

      <button class="hour" role="radio" data-pal="lauds" id="h-lauds" style="--sw:linear-gradient(135deg,#ffd9a8,#f4a07a 55%,#d9667a)"><span class="sw"></span><span class="lat">Lauds</span><span class="zh">sunrise</span></button>
      <button class="hour" role="radio" data-pal="sext" id="h-sext" style="--sw:linear-gradient(135deg,#fffaf0,#f1e6c8 55%,#3a6ad6)"><span class="sw"></span><span class="lat">Sext</span><span class="zh">noon</span></button>
      <button class="hour" role="radio" data-pal="vespers" id="h-vespers" style="--sw:linear-gradient(135deg,#f4b43a,#c01c34 55%,#2a4fc4)"><span class="sw"></span><span class="lat">Vespers</span><span class="zh">sunset</span></button>
      <button class="hour" role="radio" data-pal="compline" id="h-compline" style="--sw:linear-gradient(135deg,#9cb6ea,#2f63d8 55%,#132a86)"><span class="sw"></span><span class="lat">Compline</span><span class="zh">night</span></button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button class="tool glassbtn" id="glass" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Terracotta glass</button>
    <button class="tool" id="drift" aria-pressed="true"><span class="dot" aria-hidden="true"></span>Light drifting</button>
    <button class="tool" id="gyro" aria-pressed="false" hidden><span class="dot" aria-hidden="true"></span>Gyroscope</button>
    <button class="tool" id="fs" hidden>Fullscreen</button>
  </div>
</div>

<script>
(() => {
"use strict";
const QS = new URLSearchParams(location.search);
const EXPORT = QS.has('export');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- scene constants (mirrored in GLSL) ---------- */
const ATW = 4096, ATH = 2048;
const SIDE = { hw: 1.15, h1: 4.3 }; SIDE.H = SIDE.h1 + Math.sqrt(3) * SIDE.hw;
const END  = { hw: 3.0,  h1: 6.5 }; END.H  = END.h1 + Math.sqrt(3) * END.hw;
const sideReg = v => ({ x: 8 + v * 528, y: 8, w: 512, h: 1400 });
const endReg = { x: 1600, y: 8, w: 1024, h: 1996 };

/* ---------- the three hours ---------- */
const PALETTES = {
  matins: {
    glass: { ground:'#9a86e8', ground2:'#b7a7f2', deep:'#6c5fd0', border:'#ef9cc8', gold:'#ffe1bd', accent:'#8fd3f4', pale:'#f6f2ff', violet:'#c9a0f6', orange:'#f6b9a6', green:'#a8ead2' },
    sun:[1.0,0.93,0.97], sunI:8.5, amb:[0.035,0.031,0.052], sky:[0.42,0.40,0.52], stone:[0.62,0.60,0.66],
    fog:0.03, az:-46, el:17, azA:9, elA:3, exposure:0.74, bloom:0.16
  },
  lauds: {

    sun:[1.0,0.80,0.64], sunI:9.5, amb:[0.03,0.026,0.04], sky:[0.40,0.34,0.40], stone:[0.58,0.53,0.50],
    fog:0.036, az:-52, el:13, azA:9, elA:2.5, exposure:0.78, bloom:0.17
  },
  sext: {
    glass: { ground:'#2a4fc4', ground2:'#3a6ad6', deep:'#172f8f', border:'#c01c34', gold:'#f4b43a', accent:'#ef8a2a', pale:'#f1e6c8', violet:'#6b3aa0', orange:'#e9702a', green:'#3b8f5a' },
    sun:[1.0,0.95,0.88], sunI:10, amb:[0.04,0.04,0.05], sky:[0.48,0.48,0.54], stone:[0.56,0.53,0.5],
    fog:0.032, az:62, el:44, azA:7, elA:3, exposure:0.74, bloom:0.15
  },
  vespers: {
    glass: { ground:'#2a4fc4', ground2:'#3a6ad6', deep:'#172f8f', border:'#c01c34', gold:'#f4b43a', accent:'#ef8a2a', pale:'#f1e6c8', violet:'#6b3aa0', orange:'#e9702a', green:'#3b8f5a' },
    sun:[1.0,0.72,0.45], sunI:10.5, amb:[0.016,0.018,0.03], sky:[0.30,0.30,0.42], stone:[0.54,0.48,0.42],
    fog:0.032, az:40, el:21, azA:10, elA:3, exposure:0.72, bloom:0.16
  },
  compline: {
    glass: { ground:'#1f45c0', ground2:'#2f63d8', deep:'#132a86', border:'#a8183a', gold:'#e2c070', accent:'#4aa0e0', pale:'#b8cdf0', violet:'#4a32a8', orange:'#c25a3a', green:'#1f7f7c' },
    sun:[0.56,0.68,1.0], sunI:7.5, amb:[0.008,0.011,0.024], sky:[0.07,0.09,0.17], stone:[0.46,0.48,0.54],
    fog:0.05, az:14, el:38, azA:8, elA:3, exposure:1.1, bloom:0.18
  }
};

/* terracotta glass: a warm clay orange in three shades, with ivory, oat and sand panes and soft blue and green accents */
const GLASS_TERRA = { ground:'#D97757', ground2:'#E3A184', deep:'#B5583B', border:'#6A9BCC', gold:'#F0EEE6', accent:'#788C5D', pale:'#FAF9F5', violet:'#6A9BCC', orange:'#E3DACC', green:'#788C5D' };

/* ---------- utilities ---------- */
function rng32(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const hexRGB = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function vary(h, rnd, amt = 0.1){
  const c = hexRGB(h), k = 1 + (rnd()*2-1)*amt, s = (rnd()*2-1)*amt*0.5;
  return `rgb(${clamp(c[0]*k*(1+s),0,255)|0},${clamp(c[1]*k,0,255)|0},${clamp(c[2]*k*(1-s),0,255)|0})`;
}

/* ---------- atlas painter: stained glass in local window units ---------- */
function painter(reg, hw, H){
  const kx = reg.w / (2*hw), ky = reg.h / H;
  return { X: u => reg.x + (u + hw)*kx, Y: v => ATH - reg.y - v*ky, k: (kx + ky) / 2, reg };
}
function lancet(hw, h1, cx = 0, y0 = 0, n = 40){
  const R = 2*hw, pts = [[cx-hw, y0], [cx-hw, y0+h1]];
  for (let i = 1; i <= n; i++){ const a = Math.PI - (Math.PI/3)*i/n; pts.push([cx + hw + R*Math.cos(a), y0 + h1 + R*Math.sin(a)]); }
  for (let i = 1; i <= n; i++){ const a = Math.PI/3 - (Math.PI/3)*i/n; pts.push([cx - hw + R*Math.cos(a), y0 + h1 + R*Math.sin(a)]); }
  pts.push([cx+hw, y0]);
  return pts;
}
function circ(cx, cy, r, n = 72){ const p = []; for (let i = 0; i < n; i++){ const a = i/n*Math.PI*2; p.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } return p; }
function sector(cx, cy, r0, r1, a0, a1, n = 16){
  const p = [];
  for (let i = 0; i <= n; i++){ const a = a0 + (a1-a0)*i/n; p.push([cx + r1*Math.cos(a), cy + r1*Math.sin(a)]); }
  for (let i = n; i >= 0; i--){ const a = a0 + (a1-a0)*i/n; p.push([cx + r0*Math.cos(a), cy + r0*Math.sin(a)]); }
  return p;
}
function leaf(ax, ay, bx, by, w, n = 18){
  const dx = bx-ax, dy = by-ay, L = Math.hypot(dx, dy), px = -dy/L, py = dx/L, p = [];
  for (let i = 0; i <= n; i++){ const t = i/n, s = Math.pow(Math.sin(Math.PI*t), 0.85)*w; p.push([ax+dx*t+px*s, ay+dy*t+py*s]); }
  for (let i = n-1; i > 0; i--){ const t = i/n, s = Math.pow(Math.sin(Math.PI*t), 0.85)*w; p.push([ax+dx*t-px*s, ay+dy*t-py*s]); }
  return p;
}
function quatrefoil(cx, cy, r, n = 24){
  const d = r/2, p = [];
  for (let k = 0; k < 4; k++){
    const ca = k*Math.PI/2, ox = cx + d*Math.cos(ca), oy = cy + d*Math.sin(ca);
    for (let i = 0; i <= n; i++){ const a = ca - Math.PI/2 + Math.PI*i/n; p.push([ox + d*Math.cos(a), oy + d*Math.sin(a)]); }
  }
  return p;
}
function addPoly(g, P, pts, close = true){ pts.forEach(([u,v],i) => i ? g.lineTo(P.X(u),P.Y(v)) : g.moveTo(P.X(u),P.Y(v))); if (close) g.closePath(); }
function fillPts(g, P, pts, col){ g.beginPath(); addPoly(g, P, pts); g.fillStyle = col; g.fill(); }
function clipPts(g, P, pts){ g.beginPath(); addPoly(g, P, pts); g.clip(); }
function cut(g, w, build){
  g.save(); g.globalCompositeOperation = 'destination-out'; g.strokeStyle = '#000'; g.fillStyle = '#000';
  g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath(); build(); g.stroke(); g.restore();
}
function line(g, P, a, b, c, d){ g.moveTo(P.X(a), P.Y(b)); g.lineTo(P.X(c), P.Y(d)); }

function quarries(g, P, x0, x1, y0, y1, a, b, colorFn, lw){
  const cells = [];
  for (let j = Math.floor(y0/b) - 1; j <= Math.ceil(y1/b) + 1; j++){
    const off = (j & 1) ? a : 0;
    for (let i = Math.floor(x0/(2*a)) - 1; i <= Math.ceil(x1/(2*a)) + 1; i++){
      const cx = i*2*a + off, cy = j*b;
      const pts = [[cx-a,cy],[cx,cy+b],[cx+a,cy],[cx,cy-b]];
      fillPts(g, P, pts, colorFn(cx, cy, i, j)); cells.push(pts);
    }
  }
  cut(g, lw, () => cells.forEach(c => addPoly(g, P, c)));
}
function rectMosaic(g, P, x0, x1, y0, y1, cw, ch, colorFn, lw, rnd){
  const cells = [];
  for (let y = y0, r = 0; y < y1; y += ch, r++){
    const off = (r & 1) ? cw*0.5 : 0;
    for (let x = x0 - off; x < x1; x += cw){
      const q = [[x,y],[x+cw,y],[x+cw,y+ch],[x,y+ch]];
      fillPts(g, P, q, colorFn(x, y));
      if (rnd() < 0.28){ const t = rnd() < 0.5 ? [q[0],q[1],q[2]] : [q[1],q[2],q[3]]; fillPts(g, P, t, colorFn(x+0.01, y+0.01)); cells.push(t); }
      cells.push(q);
    }
  }
  cut(g, lw, () => cells.forEach(c => addPoly(g, P, c)));
}
function petalMedallion(g, P, cx, cy, r, pal, rnd, lw, petals = 8){
  const G = pal.glass;
  fillPts(g, P, circ(cx, cy, r), vary(G.border, rnd, .08));
  fillPts(g, P, circ(cx, cy, r*0.84), vary(G.deep, rnd, .08));
  const cols = [G.gold, G.accent, G.pale, G.violet];
  const lv = [];
  for (let i = 0; i < petals; i++){
    const a = i/petals*Math.PI*2 + Math.PI/2;
    const p = leaf(cx + Math.cos(a)*r*0.3, cy + Math.sin(a)*r*0.3, cx + Math.cos(a)*r*0.8, cy + Math.sin(a)*r*0.8, r*0.17);
    fillPts(g, P, p, vary(cols[i % 2 ? 1 : 0], rnd, .1)); lv.push(p);
  }
  fillPts(g, P, circ(cx, cy, r*0.3), vary(G.border, rnd, .06));
  fillPts(g, P, circ(cx, cy, r*0.15), vary(G.gold, rnd, .06));
  cut(g, lw, () => {
    addPoly(g, P, circ(cx, cy, r)); addPoly(g, P, circ(cx, cy, r*0.84)); addPoly(g, P, circ(cx, cy, r*0.3)); addPoly(g, P, circ(cx, cy, r*0.15));
    lv.forEach(p => addPoly(g, P, p));
    for (let i = 0; i < 16; i++){ const a = i/16*Math.PI*2; line(g, P, cx + Math.cos(a)*r*0.84, cy + Math.sin(a)*r*0.84, cx + Math.cos(a)*r, cy + Math.sin(a)*r); }
    for (let i = 0; i < petals; i++){ const a = (i+0.5)/petals*Math.PI*2 + Math.PI/2; line(g, P, cx + Math.cos(a)*r*0.3, cy + Math.sin(a)*r*0.3, cx + Math.cos(a)*r*0.84, cy + Math.sin(a)*r*0.84); }
  });
}
function quatrefoilMedallion(g, P, cx, cy, r, pal, rnd, lw){
  const G = pal.glass;
  const q = quatrefoil(cx, cy, r);
  fillPts(g, P, q, vary(G.ground2, rnd, .08));
  fillPts(g, P, quatrefoil(cx, cy, r*0.8), vary(G.pale, rnd, .06));
  fillPts(g, P, circ(cx, cy, r*0.42), vary(G.border, rnd, .06));
  const dia = [[cx, cy + r*0.34],[cx + r*0.34, cy],[cx, cy - r*0.34],[cx - r*0.34, cy]];
  fillPts(g, P, dia, vary(G.gold, rnd, .06));
  cut(g, lw, () => {
    addPoly(g, P, q); addPoly(g, P, quatrefoil(cx, cy, r*0.8)); addPoly(g, P, circ(cx, cy, r*0.42)); addPoly(g, P, dia);
    for (let k = 0; k < 4; k++){ const a = k*Math.PI/2 + Math.PI/4; line(g, P, cx + Math.cos(a)*r*0.42, cy + Math.sin(a)*r*0.42, cx + Math.cos(a)*r*0.7, cy + Math.sin(a)*r*0.7); }
  });
}
function rosette(g, P, cx, cy, r, n, pal, rnd, lw){
  const G = pal.glass, lv = [];
  fillPts(g, P, circ(cx, cy, r), vary(G.deep, rnd, .08));
  for (let i = 0; i < n; i++){ const a = i/n*Math.PI*2 + Math.PI/2; const p = leaf(cx, cy, cx + Math.cos(a)*r*0.95, cy + Math.sin(a)*r*0.95, r*0.26); fillPts(g, P, p, vary(i % 2 ? G.gold : G.border, rnd, .08)); lv.push(p); }
  fillPts(g, P, circ(cx, cy, r*0.22), vary(G.pale, rnd, .05));
  cut(g, lw, () => { addPoly(g, P, circ(cx, cy, r)); addPoly(g, P, circ(cx, cy, r*0.22)); lv.forEach(p => addPoly(g, P, p)); });
}
function borderBand(g, P, outer, pal, rnd, lw, step, hTop){
  const G = pal.glass;
  fillPts(g, P, outer, vary(G.border, rnd, .06));
  g.save(); clipPts(g, P, outer);
  for (let y = 0, i = 0; y < hTop; y += step, i++){ if (i % 3 === 2){ fillPts(g, P, [[-9,y],[9,y],[9,y+step*0.45],[-9,y+step*0.45]], vary(G.gold, rnd, .08)); } }
  g.restore();
  cut(g, lw, () => { for (let y = 0, i = 0; y < hTop; y += step, i++){ line(g, P, -9, y, 9, y); if (i % 3 === 2) line(g, P, -9, y+step*0.45, 9, y+step*0.45); } });
}
function mottle(g, reg, rnd, count){
  const top = ATH - reg.y - reg.h;

/* ---------- tileable 3D noise for haze ---------- */
function makeNoise(N){
  const rnd = rng32(91), oct = [[4,.5],[8,.27],[16,.15],[32,.08]];
  const lat = oct.map(([f]) => { const a = new Float32Array(f*f*f); for (let i = 0; i < a.length; i++) a[i] = rnd(); return a; });
  const out = new Float32Array(N*N*N); let mn = 9, mx = -9;
  const sm = t => t*t*(3-2*t);
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    let v = 0;
    oct.forEach(([f, amp], o) => {
      const fx = x*f/N, fy = y*f/N, fz = z*f/N, ix = fx|0, iy = fy|0, iz = fz|0, tx = sm(fx-ix), ty = sm(fy-iy), tz = sm(fz-iz);
      const A = lat[o], X1 = (ix+1)%f, Y1 = (iy+1)%f, Z1 = (iz+1)%f;
      const at = (a, b, c) => A[a + f*(b + f*c)];
      const c00 = at(ix,iy,iz)*(1-tx) + at(X1,iy,iz)*tx, c10 = at(ix,Y1,iz)*(1-tx) + at(X1,Y1,iz)*tx;
      const c01 = at(ix,iy,Z1)*(1-tx) + at(X1,iy,Z1)*tx, c11 = at(ix,Y1,Z1)*(1-tx) + at(X1,Y1,Z1)*tx;
      v += amp*((c00*(1-ty) + c10*ty)*(1-tz) + (c01*(1-ty) + c11*ty)*tz);
    });
    const i = x + N*(y + N*z); out[i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
  }
  const u8 = new Uint8Array(N*N*N); for (let i = 0; i < u8.length; i++) u8[i] = clamp((out[i]-mn)/(mx-mn)*255, 0, 255);
  return u8;
}

const COMMON = `
precision highp float;

uniform vec3 uSun;
uniform vec3 uSunCol;

  return max(d, -q.y);
}
vec3 glassTex(vec4 reg, vec2 uv, float lod){
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec3(0.0);

vec3 sunVis(vec3 p, float lodAdd){

    vec3 qo = p + L*tO;

const FS_VOL = `#version 300 es
${SCENE_LIB}

const FS_SCENE = `#version 300 es

  let i = 0; while (i < SCHEDULE.length - 2 && h >= SCHEDULE[i+1][1]) i++;
  const [a, ta] = SCHEDULE[i], [b, tb] = SCHEDULE[i+1];
  let k = clamp((h - ta)/Math.max(tb - ta, 1e-3), 0, 1); k = k*k*(3 - 2*k);
  const A = PALETTES[a], B = PALETTES[b], o = {};
  NUM.forEach(f => o[f] = A[f] + (B[f] - A[f])*k);
  VEC.forEach(f => o[f] = A[f].map((v, j) => v + (B[f][j] - v)*k));
  return { pal: o, near: k < 0.5 ? a : b };
}
function curPal(){
  if (state.pal !== 'now') return PALETTES[state.pal];
  const now = performance.now();
  if (!blendCache.pal || now - blendCache.t > 2000){ const r = blendNow(); blendCache = { t: now, pal: r.pal, near: r.near }; }
  return blendCache.pal;
}
const nativeKey = () => state.pal === 'now' ? (curPal(), blendCache.near) : state.pal;
const glassSet = () => ({ glass: state.glass === 'terra' ? GLASS_TERRA : PALETTES[nativeKey()].glass });
const off = { az: 0, el: 0, tAz: 0, tEl: 0, gx: 0, gy: 0, tgx: 0, tgy: 0, cam: 0 };
let ampK = 1, LOOP = 40, simT = 0, quality = { steps: 40, march: 110, march2: 60 };
let renderScale = 1, slowLocked = false;

function sunDir(phi){
  const p = curPal();
  const az = (p.az + p.azA*ampK*Math.sin(phi) + off.az + off.gx*28) * Math.PI/180;
  const el = clamp(p.el + p.elA*ampK*Math.sin(phi + 1.1) + off.el + off.gy*12, 4, 72) * Math.PI/180;
  return [Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el)];
}

function render(phi){
  const p = curPal();
  const w = cv.width, h = cv.height;
  if (hdr.w !== w || hdr.h !== h) allocHdr(w, h);
  const L = sunDir(phi);
  const sunCol = p.sun.map(c => c*p.sunI);
  const camX = 0.1*ampK*Math.sin(phi + 0.6) + off.gx*0.45 + off.cam;
  const ro = [camX, 1.38 + 0.03*ampK*Math.sin(phi*2.0), 1.6];
  const ta = [camX*0.25, 5.2, -LZ_JS];
  const fov = Math.tan(29.5*Math.PI/180);
  const dr = 0.0055*LOOP;
  const drift = [Math.cos(phi)*dr, Math.sin(phi)*dr*0.6, Math.sin(phi)*dr];
  const bounce = [0,1,2].map(i => sunCol[i]*0.0035 + endAvg[i]*p.sky[i]*0.25);
  const endGlow = [0,1,2].map(i => endAvg[i]*(p.sky[i]*1.4 + sunCol[i]*Math.max(-L[2], 0)*0.08));

  gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_3D, noiseTex);
  const setU = (U, rw, rh) => {
  gl.uniform2f(U.uRes, rw, rh);
  gl.uniform3fv(U.uRo, ro); gl.uniform3fv(U.uTa, ta); gl.uniform1f(U.uFov, fov);
  gl.uniform3fv(U.uSun, L); gl.uniform3fv(U.uSunCol, sunCol);
  gl.uniform3fv(U.uAmb, p.amb); gl.uniform3fv(U.uSky, p.sky); gl.uniform3fv(U.uEndGlow, endGlow);
  gl.uniform3fv(U.uStone, p.stone); gl.uniform3fv(U.uBounce, bounce);
  gl.uniform1f(U.uFog, p.fog); gl.uniform3fv(U.uDrift, drift); gl.uniform1f(U.uBlur, 0.0065);
  gl.uniform1i(U.uSteps, quality.steps); gl.uniform1i(U.uMarch, quality.march); gl.uniform1i(U.uMarch2, quality.march2);
  gl.uniform1i(U.uAtlas, 0); gl.uniform1i(U.uNoise, 1); gl.uniform1i(U.uEncode, ENCODE);
  };
  gl.bindFramebuffer(gl.FRAMEBUFFER, vol.fb);
  gl.viewport(0, 0, vol.w, vol.h);
  gl.useProgram(P_VOL.p); setU(P_VOL.u, vol.w, vol.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fb);
  gl.viewport(0, 0, w, h);
  gl.useProgram(P_SCENE.p); setU(P_SCENE.u, w, h);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, vol.tex);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, vol.rtex);
  gl.uniform1i(P_SCENE.u.uVol, 3); gl.uniform1i(P_SCENE.u.uRefl, 4);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(P_DUST.p);
  const D = P_DUST.u;
  gl.uniform3fv(D.uRo, ro); gl.uniform3fv(D.uTa, ta); gl.uniform1f(D.uFov, fov);
  gl.uniform1f(D.uPhase, phi); gl.uniform1f(D.uDustR, 0.008*LOOP); gl.uniform1f(D.uPx, Math.max(1, w/1400)); gl.uniform2f(D.uRes, w, h);
  gl.uniform3fv(D.uSun, L); gl.uniform3fv(D.uSunCol, sunCol); gl.uniform1f(D.uBlur, 0.011); gl.uniform1i(D.uAtlas, 0);
  gl.drawArrays(gl.POINTS, 0, 700);
  gl.disable(gl.BLEND);

  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, hdr.tex);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(P_COMP.p);
  const C = P_COMP.u;
  gl.uniform1i(C.uHdr, 2); gl.uniform2f(C.uRes, w, h);
  gl.uniform1f(C.uExposure, p.exposure); gl.uniform1f(C.uBloom, p.bloom); gl.uniform1i(C.uEncode, ENCODE);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
const LZ_JS = 22.5;

/* ---------- export hooks (local rendering of the wallpaper files) ---------- */
if (EXPORT){
  document.getElementById('hud').hidden = true;
  window.__nave = {
    setup(w, h, steps, march, loop, pal, amp, glass){
      ampK = amp == null ? 1 : amp; state.glass = glass || 'native';
      cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = w; cv.height = h;
      quality = { steps, march, march2: Math.round(march*0.6) }; LOOP = loop; state.pal = pal; blendCache.pal = null;
      uploadAtlas(glassSet()); return 'ok ' + (ENCODE ? 'rgba8' : 'float');
    },
    frame(i, n){ render(i/n*Math.PI*2); gl.finish(); return cv.toDataURL('image/png'); },
    sweep(i, n){ render(-Math.PI/2 + Math.PI*i/(n - 1)); gl.finish(); return cv.toDataURL('image/png'); },
    atlas(){ return atlasCanvas.toDataURL('image/png'); }
  };
  window.__naveReady = true;
  return;
}

/* ---------- live page ---------- */
let paintedKey = null, swapping = false;
function repaint(){ paintedKey = state.glass === 'terra' ? 'terra' : nativeKey(); uploadAtlas(glassSet()); }
function swapGlass(after){
  swapping = true; cv.classList.add('fading');
  setTimeout(() => { if (after) after(); repaint(); requestAnimationFrame(() => { cv.classList.remove('fading'); swapping = false; }); }, reduced ? 0 : 460);
}
repaint();
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = Math.max(1, innerWidth), cssH = Math.max(1, innerHeight);
  const budget = 1.1e6 * renderScale;
  const s = Math.min(dpr, Math.sqrt(budget/(cssW*cssH)));
  const w = Math.round(cssW*s), h = Math.round(cssH*s);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
}
addEventListener('resize', resize); resize();

let last = performance.now(), acc = 0, nAcc = 0, fastRuns = 0;
function tick(now){
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  if (state.drift) simT += dt;
  if (state.pal === 'now' && state.glass === 'native' && !swapping){
    curPal();
    if (blendCache.near !== paintedKey){ swapGlass(); }
  }
  const k = 1 - Math.exp(-dt*5);
  off.az += (off.tAz - off.az)*k; off.el += (off.tEl - off.el)*k;
  off.gx += (off.tgx - off.gx)*k; off.gy += (off.tgy - off.gy)*k;
  render((simT/LOOP)*Math.PI*2);
  acc += dt; nAcc++;
  if (nAcc >= 45){
    const avg = acc/nAcc;
    if (avg > 0.028 && renderScale > 0.3){ renderScale *= 0.75; slowLocked = true; resize(); }
    else if (avg < 0.0185 && !slowLocked && renderScale < 2.2){ if (++fastRuns >= 2){ renderScale *= 1.3; fastRuns = 0; resize(); } }
    acc = 0; nAcc = 0;
  }
  if (!document.hidden) requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ last = performance.now(); requestAnimationFrame(tick); requestWake(); } });
requestAnimationFrame(tick);

/* screen stays awake while the scene is open, where allowed */
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }

/* ---------- interaction ---------- */
const hud = document.getElementById('hud'), hint = document.getElementById('hint');
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0, id: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} cv.classList.add('dragging'); requestWake(); });
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  const sc = 160/Math.max(320, Math.min(innerWidth, innerHeight));
  off.tAz = clamp(off.tAz + dx*sc*0.55, -120, 120);
  off.tEl = clamp(off.tEl - dy*sc*0.3, -30, 45);
  if (drag.moved > 12) hint.classList.add('gone');
});
function endDrag(e){
  if (!drag) return;
  const tap = drag.moved < 8 && performance.now() - drag.t < 350;
  drag = null; cv.classList.remove('dragging');
  if (tap) hud.classList.toggle('off');
}
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('dblclick', () => { off.tAz = 0; off.tEl = 0; });
setTimeout(() => hint.classList.add('gone'), 9000);

const hourBtns = [...document.querySelectorAll('.hour')];
function syncHours(){ hourBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.pal === state.pal))); }
hourBtns.forEach(b => b.addEventListener('click', () => {
  if (b.dataset.pal === state.pal || swapping) return;
  swapGlass(() => {
    state.pal = b.dataset.pal; blendCache.pal = null; off.tAz = 0; off.tEl = 0; syncHours();
    try { localStorage.setItem('vitrail.pal', state.pal); } catch (e) {}
  });
}));
syncHours();

const glassBtn = document.getElementById('glass');
function syncGlass(){ glassBtn.setAttribute('aria-pressed', String(state.glass === 'terra')); }
glassBtn.addEventListener('click', () => {
  if (swapping) return;
  swapGlass(() => {
    state.glass = state.glass === 'terra' ? 'native' : 'terra'; syncGlass();
    try { localStorage.setItem('vitrail.glass', state.glass); } catch (e) {}
  });
});
syncGlass();

const driftBtn = document.getElementById('drift');
function syncDrift(){ driftBtn.setAttribute('aria-pressed', String(state.drift)); driftBtn.lastChild.textContent = state.drift ? 'Light drifting' : 'Light paused'; }
driftBtn.addEventListener('click', () => { state.drift = !state.drift; syncDrift(); });
syncDrift();

const gyroBtn = document.getElementById('gyro');
let beta0 = null;
function orientXY(e){
  const ang = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  const g = e.gamma || 0, b = e.beta || 0;
  if (ang === 90) return [b, -g];
  if (ang === -90 || ang === 270) return [-b, g];
  if (ang === 180) return [-g, -b];
  return [g, b];
}
function onOrient(e){
  if (e.gamma == null && e.beta == null) return;
  const [x, y] = orientXY(e);
  if (beta0 === null) beta0 = y;
  beta0 += (y - beta0)*0.004;
  off.tgx = clamp(x/40, -1, 1);
  off.tgy = clamp(-(y - beta0)/30, -1, 1);
  if (!state.gyro){ state.gyro = true; gyroBtn.setAttribute('aria-pressed', 'true'); hint.textContent = 'Tilt your device to turn the sun'; hint.classList.remove('gone'); setTimeout(() => hint.classList.add('gone'), 5000); }
}
let framed = true; try { framed = window.top !== window.self; } catch (e) {}
if (!framed && 'DeviceOrientationEvent' in window && matchMedia('(pointer: coarse)').matches){
  gyroBtn.hidden = false;
  hint.textContent = 'Tap Gyroscope, then tilt your device · dragging also turns the sun';
  gyroBtn.addEventListener('click', async () => {
    if (state.gyro){ removeEventListener('deviceorientation', onOrient); state.gyro = false; off.tgx = 0; off.tgy = 0; gyroBtn.setAttribute('aria-pressed', 'false'); return; }
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function'){
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') throw new Error('denied');
      }
      beta0 = null; addEventListener('deviceorientation', onOrient);
      setTimeout(() => { if (!state.gyro){ removeEventListener('deviceorientation', onOrient); gyroBtn.disabled = true; showNote('No gyroscope here. Dragging the scene turns the sun just the same.', 4200); } }, 1500);
    } catch (e){ gyroBtn.disabled = true; showNote('No gyroscope here. Dragging the scene turns the sun just the same.', 4200); }
  });
}
const fsBtn = document.getElementById('fs');
const root = document.documentElement;
const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
if (reqFS && (document.fullscreenEnabled || document.webkitFullscreenEnabled)){
  fsBtn.hidden = false;
  fsBtn.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else { await reqFS.call(root); hud.classList.add('off'); }
    } catch (e){ fsBtn.hidden = true; }
  });
}
})();
</script>

</body>
